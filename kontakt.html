<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt — Sultan Racing</title>
<meta name="description" content="Schreib mir — per Mail oder direkt über das Formular.">
<meta name="theme-color" content="#B41229">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23B41229'/%3E%3Cpath d='M11 22V11l7 5.2L24 8l6 8.2 7-5.2v11z' fill='%23C9A227'/%3E%3Cpath d='M11 27h4l2.2-3.6a3 3 0 0 1 2.6-1.4h8.4a3 3 0 0 1 2.6 1.4L33 27h4a2 2 0 0 1 0 4H11a2 2 0 0 1 0-4z' fill='%23FFF8EE'/%3E%3Ccircle cx='16' cy='35' r='4.5' fill='%23FFF8EE'/%3E%3Ccircle cx='32' cy='35' r='4.5' fill='%23FFF8EE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-seite="kontakt">
<div id="kopf-halter"></div>

<main id="inhalt">

<section class="seitenkopf">
  <div class="huelle seitenkopf__innen">
    <p class="kicker" data-i18n="kontakt.kicker">Schreib mir</p>
    <h1 data-i18n="kontakt.titel">Kontakt</h1>
    <p data-i18n="kontakt.lead"></p>
  </div>
</section>

<section class="abschnitt">
  <div class="huelle">
    <div class="kontakt__gitter">

      <div class="kontakt__direkt">
        <h3 data-i18n="kontakt.direkt">Direkt per E-Mail</h3>
        <a class="mail" id="mail-link" href="#"></a>

        <h3 class="abstand-oben" data-i18n="kontakt.social">Oder auf meinen Kanälen</h3>
        <ul class="sozial" id="sozial"></ul>

        <p class="hinweis hinweis--klein" data-i18n="teams.hinweis"></p>
      </div>

      <form class="formular" id="formular" novalidate>
        <p class="formular__warnung" id="formular-warnung" hidden data-i18n="form.nichtEingerichtet"></p>

        <div class="feld">
          <label for="f-name" data-i18n="form.name">Name</label>
          <input type="text" id="f-name" name="name" required autocomplete="name"
                 data-i18n-placeholder="form.namePh">
        </div>

        <div class="feld">
          <label for="f-mail" data-i18n="form.email">E-Mail</label>
          <input type="email" id="f-mail" name="email" required autocomplete="email"
                 data-i18n-placeholder="form.emailPh">
        </div>

        <div class="feld">
          <label for="f-thema" data-i18n="form.thema">Worum geht es?</label>
          <select id="f-thema" name="thema">
            <option value="hallo" data-i18n="form.thema1">Einfach Hallo sagen</option>
            <option value="praktikum" data-i18n="form.thema2">Praktikum / Studium</option>
            <option value="sponsoring" data-i18n="form.thema3">Sponsoring</option>
            <option value="content" data-i18n="form.thema4">Content &amp; Zusammenarbeit</option>
            <option value="sonstiges" data-i18n="form.thema5">Etwas anderes</option>
          </select>
        </div>

        <div class="feld">
          <label for="f-text" data-i18n="form.nachricht">Nachricht</label>
          <textarea id="f-text" name="nachricht" rows="5" required
                    data-i18n-placeholder="form.nachrichtPh"></textarea>
        </div>

        <!-- Spamfalle: für Menschen unsichtbar -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="honigtopf">

        <button type="submit" class="knopf knopf--primaer knopf--breit" id="senden" data-i18n="form.senden">
          Nachricht senden
        </button>

        <p class="formular__status" id="formular-status" role="status" aria-live="polite"></p>
        <p class="formular__klein" data-i18n="form.datenschutz"></p>
      </form>

    </div>
  </div>
</section>

</main>

<div id="fuss-halter"></div>
<script src="data/inhalte.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
