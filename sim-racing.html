<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim-Racing — Sultan Racing</title>
<meta name="description" content="iRacing, Assetto Corsa Competizione und warum ich fast nur GT3 fahre.">
<meta name="theme-color" content="#B41229">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23B41229'/%3E%3Cpath d='M11 22V11l7 5.2L24 8l6 8.2 7-5.2v11z' fill='%23C9A227'/%3E%3Cpath d='M11 27h4l2.2-3.6a3 3 0 0 1 2.6-1.4h8.4a3 3 0 0 1 2.6 1.4L33 27h4a2 2 0 0 1 0 4H11a2 2 0 0 1 0-4z' fill='%23FFF8EE'/%3E%3Ccircle cx='16' cy='35' r='4.5' fill='%23FFF8EE'/%3E%3Ccircle cx='32' cy='35' r='4.5' fill='%23FFF8EE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-seite="sim">
<div id="kopf-halter"></div>

<main id="inhalt">

<section class="seitenkopf">
  <div class="huelle seitenkopf__innen">
    <p class="kicker" data-i18n="sim.kicker">Am Simulator</p>
    <h1 data-i18n="sim.titel">Sim-Racing</h1>
    <p data-i18n="sim.lead"></p>
  </div>
</section>

<section class="abschnitt">
  <div class="huelle">
    <div class="kart__gitter">
      <div class="fliess">
        <p data-i18n="sim.p1"></p>
        <p data-i18n="sim.p2"></p>
        <p data-i18n="sim.p3"></p>
        <p data-i18n="sim.p4"></p>
      </div>

      <div class="tafel-stapel">
        <div class="tafel">
          <h3 data-i18n="sim.plattform.titel">Plattformen</h3>
          <p data-i18n="sim.plattform.text"></p>
          <!-- Nur echte Spiele hier rein. GT3 ist eine Fahrzeugklasse,
               kein Spiel — das gehört in den Text, nicht in diese Liste. -->
          <ul class="marken">
            <li>iRacing</li>
            <li>Assetto Corsa Competizione</li>
          </ul>
        </div>

        <div class="tafel tafel--gold">
          <h3 data-i18n="sim.rating.titel">Aktueller Stand</h3>
          <p class="wert-gross" id="irating-wert" hidden>
            <span class="wert-gross__zahl"></span>
            <span class="wert-gross__label" data-i18n="sim.rating.label">iRating</span>
          </p>
          <p class="tafel__zeile"><span data-i18n="sim.rig.titel">Mein Setup</span><strong id="rig-wert"></strong></p>
          <p class="notiz" data-i18n="sim.hinweis"></p>
        </div>
      </div>
    </div>
  </div>
</section>

</main>

<div id="fuss-halter"></div>
<script src="data/inhalte.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
